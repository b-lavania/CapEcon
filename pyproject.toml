[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capecon"
version = "2.0.0"
description = "Decision-grade analytics for agentic software systems - outcome verification platform with proprietary economics engine"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Copyright (c) 2026 CapEcon. All rights reserved. Not licensed for redistribution."}
authors = [
    {name = "CapEcon", email = "contact@capecon.ai"}
]
keywords = [
    "agentic-ai",
    "outcome-verification",
    "economics",
    "governance",
    "opentelemetry",
    "langfuse",
    "decision-engine",
    "churn",
    "retention",
    "unit-economics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "lifelines>=0.27.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0",
    "plotly>=5.0.0",
    "httpx>=0.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.80.0",
    "pytest-cov>=4.1.0",
]
mmm = [
    "pymc>=5.0.0",
    "arviz>=0.16.0",
]
pypricing = [
    "pypricing>=0.1.0",
]
standards = [
    "jsonschema>=4.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/b-lavania/CapEcon"
Documentation = "https://github.com/b-lavania/CapEcon#readme"
Repository = "https://github.com/b-lavania/CapEcon"

[tool.setuptools]
# Monolithic repo - auto-discover all packages
find = {}

[tool.setuptools.package-data]
# Include all YAML, JSON, and CSS files
"*" = ["*.yaml", "*.json", "*.css"]
"ontology" = ["**/*.yaml", "**/*.json"]
"assets" = ["*.css"]
"ui" = ["**/*.css"]
"standards" = ["**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-m 'not slow' --hypothesis-profile=dev"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.hypothesis.profiles.dev]
max_examples = 10
deadline = 0

[tool.hypothesis.profiles.ci]
max_examples = 100
deadline = 0

