vertical: marketplace_commerce
ontology_version: marketplace_commerce_v1
taxonomy_module: ontology.exception_taxonomy

subject:
  seller_id: "Marketplace seller workspace"
  capability_id: "Agent workflow capability"
  assist_type: "Commerce assist type"

decision.verdict:
  healthy: "Workflow economics healthy"
  leaking: "Verification or activation gap"
  destructive: "Trust or harm signal"
  uneconomic: "Inference cost exceeds platform take"
  underpowered: "Insufficient transaction volume"
  needs_review: "Concentration or policy review"

decision.recommended_action:
  ship: "Promote workflow traffic"
  hold: "Freeze rollout"
  throttle: "Cap agent-assist traffic"
  experiment: "Governed test before scale"

economics.primary_metric_label: platform_margin_at_risk_usd

classification:
  thresholds:
    platform_margin_erosion:
      margin_gap_min: 0.15
    agent_gmv_concentration:
      max_share: 0.40
    transaction_verification_gap:
      min_verify_rate: 0.55
    inference_cost_blowout:
      inference_over_take_min: 1.0

decision:
  verdict_default: needs_review
  verdict_rules:
    - verdict: uneconomic
      when_any_category: [platform_margin_erosion, inference_cost_blowout]
    - verdict: leaking
      when_any_category: [transaction_verification_gap]
    - verdict: needs_review
      when_any_category: [agent_gmv_concentration]
    - verdict: underpowered
      when_exception_count_lt: 1
    - verdict: needs_review
      default: true

  action_map:
    healthy:
      recommended_action: ship
      requires_review: false
      rationale: "Marketplace workflow economics healthy — maintain traffic."
    leaking:
      recommended_action: experiment
      requires_review: false
      rationale: "Verification gap — add deterministic confirmation before scale."
    destructive:
      recommended_action: throttle
      requires_review: true
      rationale: "Harm or trust signal — cap agent-assist traffic."
    uneconomic:
      recommended_action: throttle
      requires_review: false
      rationale: "Inference cost exceeds take — throttle workflow; consider take-rate policy in rationale."
    underpowered:
      recommended_action: hold
      requires_review: false
      rationale: "Low transaction volume — gather evidence."
    needs_review:
      recommended_action: hold
      requires_review: true
      rationale: "GMV concentration or policy review required."

  # Marketplace: sellers set the job price, the platform only sets the take and
  # the subsidy. So "raise_list" means raise the take rate.
  commercial_action_map:
    mesh_leak:
      commercial_action: reallocate
      rationale: "Agent retries are eating the take. Reroute before touching seller economics."
    below_floor:
      commercial_action: raise_list
      rationale: "Take per verified transaction is under the agent cost of producing it."
    over_cap:
      commercial_action: cut_credits
      rationale: "The promo or credit subsidy is what pushes this over cap."
    severely_over_cap:
      commercial_action: hold_sku
      rationale: "Agent cost is a multiple of the take. Stop routing new demand here."

# OPTIONAL: Standards export sections (ADDED IN v2.0 for interoperability)
# These sections are used ONLY for exporting to external standards (Policy Cards, ADP)
# They do NOT affect CapEcon's internal decision logic or proprietary features.

policy_card_export:
  enabled: false  # Set to true to enable Policy Card export
  export_format: policy_card  # Output format for external tools
  include_regulatory_crosswalk: true  # Include EU AI Act, NIST, ISO mappings

regulatory_mapping:
  # OPTIONAL: Crosswalk to regulatory frameworks (for Policy Card export)
  # This does NOT change CapEcon's internal semantics or verdict logic
  eu_ai_act:
    category: "limited_risk"  # Marketplace assist is typically limited-risk
    risk_level: "limited"
  nist_ai_rmf:
    category: "govern"
    functions: ["govern", "measure"]
  iso_42001:
    category: "aims"
    controls: ["quality_management"]

evidence_requirements:
  # OPTIONAL: Evidence requirements for external standards validation
  # This does NOT change CapEcon's internal evidence handling
  min_verified_share: 0.40  # Placeholder - customize based on your marketplace requirements
  requires_experiment_id: false  # Marketplace workflows typically don't require experiments
  evidence_types: ["simulated", "associational"]  # Marketplace focuses on simulated/associational
