vertical: orchestration
ontology_version: orchestration_v1
taxonomy_module: ontology.exception_taxonomy

subject:
  workspace_id: "Multi-agent workspace"
  agent_id: "Orchestrating agent"
  cohort_id: "Team deployment cohort"

decision.verdict:
  healthy: "Orchestration within policy"
  leaking: "Multi-agent handoff failures"
  destructive: "Subgraph blast radius — kill path"
  uneconomic: "Coordination cost exceeds outcome value"
  needs_review: "A2A consent or human gate required"

economics.primary_metric_label: cost_of_leaving_live_usd

classification:
  thresholds:
    capability_dead:
      max_run_count_exclusive: 3
    activation_leak:
      success_rate_prior_multiplier: 0.5
    trust_break:
      trust_rate_prior_multiplier: 1.3
    loop_exhaustion:
      use_profile_max_loops: true
    handoff_failure:
      min_success_rate: 0.75
    coordination_cost:
      max_ratio: 0.35
    orphaned_subtask:
      max_rate: 0.08

decision:
  verdict_default: needs_review
  verdict_rules:
    - verdict: destructive
      when_any_category: [trust_break, loop_exhaustion, trust_boundary, orphaned_subtask]
    - verdict: uneconomic
      when_any_category: [coordination_cost, run_cost_blowout]
    - verdict: leaking
      when_any_category: [activation_leak, connector_fragility, handoff_failure]
    - verdict: underpowered
      when_exception_count_lt: 2
    - verdict: needs_review
      default: true

  action_map:
    healthy:
      recommended_action: ship
      requires_review: false
      rationale: "Agent mesh healthy — expand routing carefully."
    leaking:
      recommended_action: experiment
      requires_review: true
      rationale: "Handoff failures — experiment routing policy before expand."
    destructive:
      recommended_action: kill
      requires_review: true
      rationale: "Orchestration failure with blast radius — kill subgraph after review."
    uneconomic:
      recommended_action: throttle
      requires_review: true
      rationale: "Coordination economics broken — throttle subgraph traffic."
    underpowered:
      recommended_action: hold
      requires_review: false
      rationale: "Insufficient handoff exposure for auto-act."
    needs_review:
      recommended_action: hold
      requires_review: true
      rationale: "A2A consent or human gate required."

# OPTIONAL: Standards export sections (ADDED IN v2.0 for interoperability)
# These sections are used ONLY for exporting to external standards (Policy Cards, ADP)
# They do NOT affect CapEcon's internal decision logic or proprietary features.

policy_card_export:
  enabled: false  # Set to true to enable Policy Card export
  export_format: policy_card  # Output format for external tools
  include_regulatory_crosswalk: true  # Include EU AI Act, NIST, ISO mappings

regulatory_mapping:
  # OPTIONAL: Crosswalk to regulatory frameworks (for Policy Card export)
  # This does NOT change CapEcon's internal semantics or verdict logic
  eu_ai_act:
    category: "high_risk"  # Multi-agent orchestration is typically high-risk
    risk_level: "high"
  nist_ai_rmf:
    category: "govern"
    functions: ["govern", "measure", "manage"]
  iso_42001:
    category: "aims"
    controls: ["risk_management", "coordination", "governance"]

evidence_requirements:
  # OPTIONAL: Evidence requirements for external standards validation
  # This does NOT change CapEcon's internal evidence handling
  min_verified_share: 0.40  # Placeholder - customize based on your orchestration requirements
  requires_experiment_id: false  # Orchestration may not require experiments
  evidence_types: ["simulated", "associational", "causal"]  # All evidence types allowed
