vertical: eval_governance
ontology_version: eval_governance_v1
taxonomy_module: ontology.exception_taxonomy

subject:
  capability_version: "Version under eval gate"
  experiment_id: "Governed experiment reference"

decision.verdict:
  underpowered: "Insufficient exposure for decision"
  eval_drift: "Offline eval diverges from online"

economics.primary_metric_label: cost_of_leaving_live_usd

classification:
  thresholds:
    eval_regression:
      score_drop_pct_min: 10.0
    eval_drift:
      online_offline_gap_min: 0.15

decision:
  verdict_default: needs_review
  verdict_rules:
    - verdict: destructive
      when_any_category: [eval_regression]
    - verdict: leaking
      when_any_category: [eval_drift, quality_drift]
    - verdict: underpowered
      when_exception_count_lt: 2
    - verdict: needs_review
      default: true

  action_map:
    healthy:
      recommended_action: ship
      requires_review: false
      rationale: "Eval gate passed — safe to promote version."
    leaking:
      recommended_action: revise
      requires_review: false
      rationale: "Eval drift — revise suite or prompts before ship."
    destructive:
      recommended_action: kill
      requires_review: true
      rationale: "Eval regression beyond threshold — do not ship."
    underpowered:
      recommended_action: hold
      requires_review: false
      rationale: "Insufficient eval exposure — gather more runs."
    needs_review:
      recommended_action: hold
      requires_review: true
      rationale: "Eval governance requires human sign-off."

  commercial_action_map:
    mesh_leak:
      commercial_action: reallocate
      rationale: "The new version is retrying more, not costing more per call. Reroute before repricing."
    below_floor:
      commercial_action: raise_list
      rationale: "This version ships every verified outcome below what it costs to produce."
    over_cap:
      commercial_action: split_tier
      rationale: "Floor breaches the policy cap — fence the cohort driving it."
    severely_over_cap:
      commercial_action: hold_sku
      rationale: "Floor is a multiple of the cap. Do not sell more of this version."

# OPTIONAL: Standards export sections (ADDED IN v2.0 for interoperability)
# These sections are used ONLY for exporting to external standards (Policy Cards, ADP)
# They do NOT affect CapEcon's internal decision logic or proprietary features.

policy_card_export:
  enabled: false  # Set to true to enable Policy Card export
  export_format: policy_card  # Output format for external tools
  include_regulatory_crosswalk: true  # Include EU AI Act, NIST, ISO mappings

regulatory_mapping:
  # OPTIONAL: Crosswalk to regulatory frameworks (for Policy Card export)
  # This does NOT change CapEcon's internal semantics or verdict logic
  eu_ai_act:
    category: "limited_risk"  # Eval governance is typically limited-risk
    risk_level: "limited"
  nist_ai_rmf:
    category: "govern"
    functions: ["govern", "measure"]
  iso_42001:
    category: "aims"
    controls: ["quality_management", "risk_assessment"]

evidence_requirements:
  # OPTIONAL: Evidence requirements for external standards validation
  # This does NOT change CapEcon's internal evidence handling
  min_verified_share: 0.40  # Placeholder - customize based on your eval requirements
  requires_experiment_id: true  # Eval governance requires experiment ID
  evidence_types: ["simulated", "associational", "causal"]  # All evidence types allowed
