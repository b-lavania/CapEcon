[pytest]
# Pytest configuration for CapEcon

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests ontology/tests

# Hypothesis configuration for property-based testing
# Minimum 100 iterations per property test as per design document
addopts = 
    -v
    --strict-markers
    --tb=short
    --hypothesis-show-statistics

# Markers for organizing tests
markers =
    unit: Unit tests for specific examples and edge cases
    property: Property-based tests for universal correctness properties
    integration: Integration tests for end-to-end workflows
    slow: Tests that take longer to run

# Hypothesis settings
[tool:pytest]
hypothesis_profile = default

# Coverage settings (optional)
[coverage:run]
source = analytics
omit = 
    */tests/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
